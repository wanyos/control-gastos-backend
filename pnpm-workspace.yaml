allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
# `minimumReleaseAgeExclude`: la lista de versiones que pueden instalarse aunque
# sean recién publicadas.
#
# ⚠️ El comentario que había aquí decía que esta lista «no excluía de nada»
# porque `minimumReleaseAge` no estaba configurado en ninguna parte. Era cierto
# el 2026-08-21, con pnpm 10. Dejó de serlo al subir a pnpm 11: desde esa
# versión pnpm trae `minimumReleaseAge` **en 1440 minutos por defecto**, así que
# una versión publicada hace menos de 24 h no se instala y, como el modo
# estricto sigue apagado por defecto, pnpm se queda con una versión anterior sin
# avisar mucho. Esta lista es lo que permite saltarse esa espera.
#
# Por eso pnpm la rellena solo cuando actualizas algo recién publicado. Cada
# entrada **caduca sola** a las 24 h de publicarse esa versión: a partir de ahí
# no excluye de nada y se puede borrar en la siguiente actualización de
# dependencias. Repasada el 2026-09-20: se quitaron `fastify@5.12.5` y
# `prettier@3.9.7`, publicadas cuatro días antes (y la segunda, además, ya
# sustituida por la 3.9.8).
minimumReleaseAgeExclude:
  # tsx 4.23.15 se publicó el 2026-09-20 a las 07:22 UTC. Se puede borrar a
  # partir del 2026-09-21.
  - tsx@4.23.15
