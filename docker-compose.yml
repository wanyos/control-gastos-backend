services:
  postgres:
    image: postgres:17-alpine
    container_name: gastos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gastos
    ports:
      - "5432:5432"
    volumes:
      - gastos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gastos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gastos_pgdata:
